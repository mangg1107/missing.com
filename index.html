<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>missing.com</title>
  <link rel="stylesheet" href="./XP.css">
  <style>
    :root {
      --top-gutter: max(12px, env(safe-area-inset-top));
      --right-gutter: max(12px, env(safe-area-inset-right));
      --bottom-gutter: max(12px, env(safe-area-inset-bottom));
      --left-gutter: max(12px, env(safe-area-inset-left));
    }

    body {
      box-sizing: border-box;
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: var(--top-gutter) var(--right-gutter) var(--bottom-gutter) var(--left-gutter);
      display: grid;
      place-items: center;
      background: #000;
    }

    .prompt {
      box-sizing: border-box;
      width: min(310px, 100%);
    }

    .dialog-body {
      padding: 8px 8px 4px;
    }

    .message {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 32px;
      margin: 0 0 15px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 6px;
    }

    #errors {
      position: fixed;
      inset: var(--top-gutter) var(--right-gutter) var(--bottom-gutter) var(--left-gutter);
      pointer-events: none;
    }

    .error-window {
      box-sizing: border-box;
      pointer-events: auto;
      position: absolute;
      top: var(--y);
      left: var(--x);
      width: min(274px, 100%);
      transform: translate(calc(-1 * var(--x)), calc(-1 * var(--y)));
    }

    .error-icon {
      flex: 0 0 32px;
    }

    @media (max-width: 600px), (pointer: coarse) {
      .prompt {
        width: min(360px, 100%);
      }

      .dialog-body,
      .actions button {
        font-size: 14px;
      }

      .actions button {
        min-width: 82px;
        min-height: 44px;
      }

      .title-bar {
        height: auto;
      }

      .title-bar-controls button[aria-label="Close"] {
        background-color: transparent;
        min-width: 44px;
        min-height: 44px;
        background-size: 21px 21px;
      }
    }
  </style>
  <script src="./app.js" defer></script>
</head>
<body>
  <main id="prompt" class="window prompt" role="dialog" aria-labelledby="title" aria-describedby="message">
    <div class="title-bar">
      <div class="title-bar-text" id="title">missing.com</div>
      <div class="title-bar-controls">
        <button type="button" id="close" aria-label="Close"></button>
      </div>
    </div>
    <div class="window-body dialog-body">
      <p class="message" id="message">Visit a website</p>
      <div class="actions">
        <button type="button" id="confirm" autofocus>OK</button>
        <button type="button" id="cancel">Cancel</button>
      </div>
    </div>
  </main>

  <div id="errors"></div>
  <template id="error-template">
    <div class="window error-window" role="group" aria-label="Error">
      <div class="title-bar">
        <div class="title-bar-text">Error</div>
        <div class="title-bar-controls">
          <button type="button" aria-label="Close"></button>
        </div>
      </div>
      <div class="window-body dialog-body">
        <p class="message">
          <svg class="error-icon" width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="14.5" fill="#e33224" stroke="#8e0c04"/>
            <path d="m11 11 10 10m0-10L11 21" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
          </svg>
          <span></span>
        </p>
        <div class="actions"><button type="button">OK</button></div>
      </div>
    </div>
  </template>
</body>
</html>
